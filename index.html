<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARE WE THERE YET? Tour</title>

    <style>
        /* 1. CUSTOM FONT */
        @font-face {
            font-family: 'MyCustomFont'; 
            src: url('YOUR-FONT-FILE.ttf') format('truetype'); 
            font-weight: bold;
            font-display: swap;
        }

        body {
            background-color: #181818;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px; /* Buffer for mobile screens */
            text-align: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 2. RESPONSIVE TITLE */
        .title-img {
            width: 80%;       /* Takes up 80% of the screen on mobile */
            max-width: 600px; /* Never gets bigger than 600px on desktop */
            height: auto;     /* Keeps original proportions */
            margin-bottom: 40px; 
        }

        /* 3. TRUCK */
        .uhaul-truck {
            width: 60%;
            max-width: 350px;
            height: auto;
            margin-bottom: 40px;
            animation: jerk-rotate 0.3s infinite steps(2);
        }

        @keyframes jerk-rotate {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        /* 4. RESPONSIVE COUNTDOWN TEXT */
        #countdown-text {
            font-family: 'MyCustomFont', sans-serif;
            /* Scalable size: Adjusts based on viewport width (vw) */
            font-size: clamp(2.5rem, 8vw, 5rem); 
            color: #B92432;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>

    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e);
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net');
    fbq('init', 'YOUR_PIXEL_ID_HERE'); 
    fbq('track', 'PageView');
    </script>
</head>
<body>

    <img src="title.png" alt="ARE WE THERE YET? Tour" class="title-img">
    <img src="uhaul.png" alt="U-Haul Truck" class="uhaul-truck">
    <div id="countdown-text">ARRIVING IN 3</div>

    <script>
        let timeLeft = 3;
        const countdownElement = document.getElementById('countdown-text');
        const targetUrl = "https://beacons.ai/arewethereyet.tours";

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                countdownElement.innerText = "ARRIVING IN " + timeLeft;
            } else {
                clearInterval(timer);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>
</body>
</html>
